################################################################################
#                                                                              #
#                                                                              #
#                          Tech Bench Docker Installation                      #
#           NOTE:  Check .env file for necessary fields to modify to           #
#                        secure this Tech Bench installation                   #
#                                                                              #
#                                                                              #
################################################################################
networks:
    app-tier:
        driver: bridge
volumes:
    appData:
    dbData:
    keystoreData:
    meilisearchData:
    redisData:
    storageData:

services:
    # Application Container
    tech_bench:
        container_name: tech_bench
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=app
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            database:
                condition: service_healthy

    # NGINX Web Server
    nginx:
        image: butcherman/tech_bench_nginx:${APP_VERSION:-latest}
        container_name: nginx
        restart: unless-stopped
        volumes:
            - storageData:/app/storage:ro
            - keystoreData:/app/keystore:ro
            - ./.env:/app/.env
        environment:
            - TB_URL=${BASE_URL}
        ports:
            - "80:80"
            - "443:443"
        networks:
            - app-tier
        depends_on:
            database:
                condition: service_started
            reverb:
                condition: service_started

    #  Reverb Container for Websockets
    reverb:
        container_name: reverb
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=reverb
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: healthy

    #  Horizon Container to run background jobs
    horizon:
        container_name: horizon
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=horizon
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
            nginx:
                condition: service_healthy

    #  Scheduler Container
    scheduler:
        container_name: scheduler
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=scheduler
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
            nginx:
                condition: service_healthy

    # MySQL Database Container
    database:
        image: butcherman/tech_bench_database:1.0
        container_name: database
        restart: unless-stopped
        volumes:
            - dbData:/bitnami/mysql/data
        networks:
            - app-tier
        healthcheck:
            test: ['CMD', '/opt/bitnami/scripts/mysql/healthcheck.sh']
            interval: 15s
            timeout: 5s
            retries: 6

    #  Redis Container for Cache, Job and Email Queuing
    redis:
        image: butcherman/tech_bench_redis:1.0
        container_name: redis
        restart: unless-stopped
        volumes:
            - redisData:/bitnami/redis/data
        networks:
            - app-tier

    # Melisearch Container for Search Engine
    meilisearch:
        image: butcherman/tech_bench_meilisearch:1.0
        container_name: meilisearch
        restart: unless-stopped
        volumes:
            - meilisearchData:/meili_data
        networks:
            - app-tier
