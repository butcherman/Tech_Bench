
################################################################################
# Tech Bench Docker Installation
################################################################################

networks:
    app-tier:
        driver: bridge

volumes:
    appData:
    dbData:
    keystoreData:
    meilisearchData:
    redisData:
    storageData:

services:

    # --------------------------------------------------------------------------
    # Tech Bench Application / PHP-FPM
    # --------------------------------------------------------------------------

    tech_bench:
        container_name: tech_bench
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=app
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "artisan", "health:check"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    # --------------------------------------------------------------------------
    # NGINX Web Server
    # --------------------------------------------------------------------------

    nginx:
        container_name: nginx
        restart: unless-stopped
        image: butcherman/tech_bench_nginx:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage:ro
            - keystoreData:/app/keystore
        environment:
            - TB_URL=${BASE_URL}
        ports:
            - "80:80"
            - "443:443"
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
            reverb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://127.0.0.1/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    # --------------------------------------------------------------------------
    # Laravel Reverb
    # --------------------------------------------------------------------------

    reverb:
        container_name: reverb
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=reverb
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - '$$s=@fsockopen("127.0.0.1",8080); if($$s){fclose($$s);exit(0);} exit(1);'
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

    # --------------------------------------------------------------------------
    # Laravel Horizon
    # --------------------------------------------------------------------------

    horizon:
        container_name: horizon
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=horizon
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
        healthcheck:
            disable: true

    # --------------------------------------------------------------------------
    # Laravel Scheduler
    # --------------------------------------------------------------------------

    scheduler:
        container_name: scheduler
        restart: unless-stopped
        image: butcherman/tech_bench_app:${APP_VERSION:-latest}
        volumes:
            - storageData:/app/storage
            - keystoreData:/app/keystore
            - ./.env:/app/.env
        environment:
            - SERVICE=scheduler
            - TB_URL=${BASE_URL}
        networks:
            - app-tier
        depends_on:
            tech_bench:
                condition: service_healthy
        healthcheck:
            disable: true

    # --------------------------------------------------------------------------
    # MySQL Database
    # --------------------------------------------------------------------------

    database:
        container_name: database
        restart: unless-stopped
        image: butcherman/tech_bench_database:1.0
        volumes:
            - dbData:/var/lib/mysql
        networks:
            - app-tier
        # healthcheck:
        #     test: ['CMD', '/opt/bitnami/scripts/mysql/healthcheck.sh']
        #     interval: 15s
        #     timeout: 5s
        #     retries: 6

    # --------------------------------------------------------------------------
    # Redis
    # --------------------------------------------------------------------------

    redis:
        container_name: redis
        restart: unless-stopped
        image: butcherman/tech_bench_redis:1.0
        volumes:
            - redisData:/bitnami/redis/data
        networks:
            - app-tier
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 15s
            timeout: 5s
            retries: 6

    # --------------------------------------------------------------------------
    # Meilisearch
    # --------------------------------------------------------------------------

    meilisearch:
        container_name: meilisearch
        restart: unless-stopped
        image: butcherman/tech_bench_meilisearch:1.0
        volumes:
            - meilisearchData:/meili_data
        networks:
            - app-tier
